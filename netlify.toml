# Site statique : aucune commande de build, on publie la racine du dépôt.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Discrétion : aucun site externe ne voit de quelle page vient le visiteur.
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
